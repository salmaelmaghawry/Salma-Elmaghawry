<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salma · Promo Thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#223528; --sage:#4C7A5B; --mist:#B9CFBC; --honey:#E3A02B; --oat:#F6EFE4; --ink2:#2A4031; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#111;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;background:var(--ink);overflow:hidden;font-family:Nunito,sans-serif;color:var(--oat)}
  .abs{position:absolute}
  .bub{position:absolute;border-radius:50%;overflow:hidden;background:rgba(76,122,91,.24)}
  .bub i{position:absolute;left:14%;top:9%;width:46%;height:26%;border-radius:50%;background:var(--oat);opacity:.07;transform:rotate(-32deg)}
  .frame{border-radius:34px;overflow:hidden;background:var(--ink2);outline:3px solid rgba(246,239,228,.12);transform:rotate(-1.6deg)}
  .frame img{width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
  .pill{display:inline-flex;align-items:center;gap:22px;background:var(--sage);color:var(--oat);font-weight:800;font-size:60px;
    padding:20px 46px 22px 36px;border-radius:999px}
  .stats{position:absolute;display:flex;justify-content:space-between;background:#FCF9F3;color:var(--ink);border-radius:30px;
    padding:30px 56px 34px;outline:2px solid rgba(34,53,40,.12)}
  .stats .n{font-weight:800;font-size:84px;line-height:1;letter-spacing:-.01em}
  .stats .n b{color:#6E4A32;font-weight:800}
  .stats .l{font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.3;color:#3B5A45;margin-top:10px}
  .pill i{width:28px;height:28px;border-radius:50%;background:var(--mist);box-shadow:0 0 0 10px rgba(185,207,188,.25)}
</style>
</head>
<body>
<div id="stage">
  <div class="bub" style="left:1380px;top:-300px;width:720px;height:720px"><i></i></div>
  <div class="bub" style="left:-240px;top:660px;width:620px;height:620px"><i></i></div>
  <div class="bub" style="left:1460px;top:760px;width:560px;height:560px"><i></i></div>

  <div class="frame abs" style="left:130px;top:64px;width:620px;height:810px"><img src="media/profile-desk.png" style="transform:scale(1.3);transform-origin:44% 46%"></div>

  <!-- numbers strip, same as the portfolio stats row, overlapping the photo -->
  <div class="stats" style="left:350px;top:752px;width:1200px">
    <div><div class="n">10K<b>+</b></div><div class="l">LinkedIn<br>Followers</div></div>
    <div><div class="n">6K<b>+</b></div><div class="l">YouTube<br>Subscribers</div></div>
    <div><div class="n">200<b>+</b></div><div class="l">Students<br>Taught</div></div>
    <div><div class="n">12<b>+</b></div><div class="l">Workshops<br>Organized</div></div>
  </div>

  <div class="abs" style="left:900px;top:96px">
    <div style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:40px;letter-spacing:.16em;color:var(--mist)">SALMA ELMAGHAWRY</div>
    <div style="font-weight:800;font-size:172px;line-height:.98;letter-spacing:-.02em;margin-top:22px">
      <span style="color:var(--honey)">Flutter</span><br>Developer</div>
    <div style="margin-top:40px"><span class="pill"><i></i>Open to work</span></div>
  </div>

  <svg class="abs" viewBox="0 0 100 100" style="right:64px;bottom:56px;width:92px;height:92px">
    <rect width="100" height="100" rx="29" fill="#4C7A5B"/>
    <path d="M32,30 L48,46 L32,62 M52,30 L68,46 L52,62" fill="none" stroke="#F6EFE4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="76" width="38" height="10" rx="5" fill="#E3A02B"/>
  </svg>
</div>
<script>
window.VIDEO = { w: 1920, h: 1080, dur: 1, fps: 1 };
window.render = () => {};
</script>
</body>
</html>
